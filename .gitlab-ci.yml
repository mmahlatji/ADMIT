# Runs on merge requests and on regular pushes (skipping the push pipeline
# once an MR is open for that branch, so it doesn't run twice).
# Path-based rules within each job: backend/frontend jobs only run when
# their folder changes.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - lint
  - test

backend-lint:
  stage: lint
  image: python:3.11-slim
  rules:
    - changes:
        - backend/**/*
  before_script:
    - pip install uv
    - cd backend
    - uv sync
  script:
    - uv run ruff check .

backend-test:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - backend/**/*
  before_script:
    - pip install uv
    - cd backend
    - uv sync
  script:
    - uv run pytest

frontend-lint:
  stage: lint
  image: node:20-slim
  rules:
    - changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run lint

frontend-build:
  stage: test
  image: node:20-slim
  rules:
    - changes:
        - frontend/**/*
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run build
