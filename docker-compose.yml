version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  web:
    build: ./frontend
    ports:
      - "5173:4173"
    env_file:
      - ./frontend/.env

  test_db: 
    image: postgres:17 
    container_name: postgres_test_db
    environment:
      POSTGRES_DB: admit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      
