version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:7b-instruct-q6_K
    depends_on:
      ollama: 
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env

  ollama:
    build:
      context: ./ollama
    container_name: ollama
    restart: unless-stopped
    ports:
      - "9000:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MODEL: qwen2.5-coder:7b-instruct-q6_K
      OLLAMA_KEEP_ALIVE: "-1"

    healthcheck:
      # Both halves matter: the marker says the model finished pulling, the
      # curl says the daemon is still up. /api/tags alone goes green while the
      # model is still downloading, and api depends on this being healthy.
      test: ["CMD-SHELL", "test -f /tmp/model-ready && curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A cold volume has to pull several GB before the marker appears.
      start_period: 900s

  test_db: 
    image: postgres:17 
    container_name: postgres_test_db
    environment:
      POSTGRES_DB: admit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
